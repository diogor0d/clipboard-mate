name: clipboard-mate

services:
  api:
    image: ${CLIPBOARD_MATE_IMAGE:-clipboard-mate-api:local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    environment:
      CLIPBOARD_MATE_HOST: 0.0.0.0
      CLIPBOARD_MATE_PORT: "43120"
      CLIPBOARD_MATE_DB_PATH: /data/clipboard-mate.sqlite
      CLIPBOARD_MATE_HISTORY_LIMIT: "${CLIPBOARD_MATE_HISTORY_LIMIT:-250}"
      CLIPBOARD_MATE_MAX_TEXT_BYTES: "${CLIPBOARD_MATE_MAX_TEXT_BYTES:-262144}"
      CLIPBOARD_MATE_ALLOWED_ORIGIN: "${CLIPBOARD_MATE_ALLOWED_ORIGIN:-}"
    ports:
      - "${CLIPBOARD_MATE_BIND_ADDRESS:-127.0.0.1}:${CLIPBOARD_MATE_BIND_PORT:-43120}:43120"
    volumes:
      - clipboard-mate-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:43120/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s

volumes:
  clipboard-mate-data:
